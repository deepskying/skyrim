; Follower Spellbook Manager hotkey configuration.
; Restart Skyrim after editing this file.
[Hotkey]
; A-Z, 0-9, F1-F12, Esc, Tab, Enter, Space, or a DirectInput scan code (for example 0x1F).
Key=S
; Set a modifier to true when it must be held with the key.
Shift=true
Ctrl=false
Alt=false

[LevelScaling]
; The cap used when the per-follower "Raise level cap" switch is enabled.
; Values from 1 to 1000 are accepted. This does not force fixed-level followers to scale.
MaxLevel=300

[PanelPower]
; Grant the panel lesser power on new game/load. Set 0 to remove it on next load.
Enabled=1
