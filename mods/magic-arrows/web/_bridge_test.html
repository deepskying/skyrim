<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>魔法箭工坊</title><link rel="stylesheet" href="style.css"></head>
<body><main class="panel">
<aside class="rail"><div class="brand"><span class="brand-mark">➶</span><b>魔法箭工坊</b><small>MAGIC ARROWS</small></div><nav aria-label="主视图"><button data-page="equipment" class="active"><span>➶</span>装备</button><button data-page="craft"><span>◇</span>制作</button><button data-page="settings"><span>⚙</span>设置</button></nav><div class="rail-foot"><i></i><span id="connection">正在连接游戏</span><small>0.2.2 · 面板试作</small></div></aside>
<section class="workspace"><header><div><div class="eyebrow" id="eyebrow">YOUR QUIVER</div><h1 id="title">箭矢装备</h1><p id="subtitle">整理你的箭矢，为下一次冒险做好准备。</p></div><div class="header-actions"><button id="refresh" class="quiet">↻ 刷新</button><button id="close" class="close" aria-label="关闭面板">×</button></div></header>
<div id="content"></div><footer><span id="status" role="status">等待游戏数据…</span><span><kbd id="binding-label">Shift + W</kbd> 打开 / 关闭　<kbd>Esc</kbd> 关闭</span></footer></section></main><script>
const fixture={version:'test',loaded:true,powerAvailable:true,hotkey:{key:'W',shift:true,ctrl:false,alt:false},quote:null,recipes:[],arrows:[{id:80125,name:'铁箭',family:'normal',fireballBase:true,count:10,damage:8}],spells:[{id:116617,name:'火球术',cost:86,source:'测试夹具',craftable:true,eligibility:{status:'candidate',reasons:['浏览器桥接测试：不连接游戏']}}],materials:[{id:1001,name:'已知抗火材料',count:8,units:10}],message:'桥接测试，不连接游戏'};
window.magicArrowsAction=raw=>{const q=JSON.parse(raw);
 if(q.type==='quote'){
  if(q.spell!==116617||q.bases.length!==1||q.bases[0].id!==80125||q.materials[0]!==1001)throw Error('wrong bridge request');
  const n=q.bases[0].count;fixture.quote={token:123,selection:{spell:q.spell,bases:q.bases,materials:q.materials},total:n,gold:5*n,magicka:12*n,charge:10*n,ingredients:[{id:1001,name:'已知抗火材料',count:n,units:10}],outputs:[{id:80125,name:'火焰箭·火球术〔铁箭〕',count:n}]};fixture.message='TEST QUOTE OK';
 }
 if(q.type==='craft'){
  if(q.token!==123||!fixture.quote)throw Error('duplicate or bad token');
  const n=fixture.quote.total;fixture.arrows[0].count-=n;fixture.materials[0].count-=n;fixture.arrows.push({id:900,name:'火焰箭·火球术〔铁箭〕',family:'fire',count:n,damage:8});fixture.quote=null;fixture.message='TEST COMMIT OK';
 }
 window.MagicArrows.receiveState(JSON.parse(JSON.stringify(fixture)));
};
</script><script src="app.js"></script></body></html>
