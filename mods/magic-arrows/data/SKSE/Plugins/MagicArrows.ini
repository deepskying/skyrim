[Hotkey]
Key=W
Shift=true
Ctrl=false
Alt=false

[PanelPower]
Enabled=1

[Followers]
ConsumeMagicArrows=1

[Crafting]
; Queued crafting pauses during combat; waiting for magicka does not.
PauseInCombat=1
; Numeric alchemy effects that belong to no arrow family still charge at this percentage
; (skill, fatigue and other modded actor values). 0 disables the fallback, 100 accepts
; every numeric effect. Utility effects such as water breathing never charge.
GenericMaterialPercent=50

[SoulPool]
; 1 keeps every soul the player or a follower captures in the soul pool: points are spent
; in the workshop panel on filled soul gems (plus gold) and on capacity upgrades. A soul
; the pool cannot take falls back to the vanilla capture, which fills a carried gem.
; 0 restores the previous behaviour (sealed soul arrows borrow a matching empty gem).
Enabled=1
