; Skyrim Durability Manager configuration.
; Changes made in the panel apply immediately.

[Hotkey]
; A-Z, F1-F12, Esc, Tab, Enter, Space, or a DirectInput scan code.
Key=F
Shift=true
Ctrl=false
Alt=false

[Display]
HUDRightPercent=100
HUDBottomPercent=2
; Workshop font scale (80-130%) and background transparency (0-60%).
UIFontScale=100
UITransparency=16
; A value of 30 means a warning below 30% durability.
LowDurabilityThreshold=30
WeaponDisplaySeconds=3.0
EnableLowDurabilityWarning=true
; Workshop click and outcome sounds (repair, enhancement and card refresh).
EnableWorkshopSounds=true

[Breakage]
; When false, enchanted equipment becomes broken instead of being destroyed.
; Unique equipment is always preserved as broken and repairable.
AllowEnchantedItemsToBreak=true

[Wear]
; A successful normal melee hit reduces the equipped weapon by the matching base amount.
DaggerHitWear=0.35
SwordHitWear=0.50
WarAxeHitWear=0.65
MaceHitWear=0.80
GreatswordHitWear=0.80
BattleaxeHitWear=0.95
WarhammerHitWear=1.10
; Power attacks multiply the matching melee-hit value.
PowerAttackWearMultiplier=1.60
; A successful arrow shot reduces bow durability by this base amount.
BowShotWear=1.0
; A successful bolt shot reduces crossbow durability by this base amount.
CrossbowShotWear=2.0
; Each staff spell release costs this amount (0.1-100), including concentration start.
; Charging/cancelling before release and subsequent damage ticks do not cost wear.
StaffCastWear=1.0
; An unblocked hit damages one worn armor/clothing instance, weighted by body coverage.
ArmorHitWear=1.0
ClothingHitWear=1.25
; A blocked physical hit damages the equipped shield instead of a random armor piece.
ShieldBlockWear=1.0
; Incoming power attacks multiply armor, clothing, and shield wear.
IncomingPowerAttackWearMultiplier=1.5
; Hostile magic and trap hits scale the armor/clothing base wear. 0 disables each.
MagicHitWearMultiplier=1.0
TrapHitWearMultiplier=1.0
; Same source + attacker may cause continuous magic/trap wear at most once per interval.
ContinuousHitIntervalSeconds=1.0
; Light movement wear per 1000 ground units, sampled from player footsteps. 0 disables.
MovementBootWearPer1000Units=0.02
MovementBodyWearPer1000Units=0.005
; All wear-reduction cards combined cannot reduce equipment wear beyond this value.
MaxWearReduction=0.70

[PanelPower]
; Grant the panel lesser power on new game/load. Set 0 to remove it on next load.
Enabled=1

[WorkshopSounds]
; UI sounds played by the workshop. Any SOUN or SNDR editor ID from the load order works;
; a name nothing provides simply plays nothing. Changes are read when the game loads.
Click=UIMenuOK
; Generic failure cue.
Failure=UIMenuCancel
; Repair succeed cues, split by equipment kind.
RepairWeapon=UISmithingImproveWeapon
RepairArmor=UISmithingImproveArmor
; Paid card refresh on the enhancement page.
RefreshCards=UISmithingCreateGeneric
; Enhancement success, and the item being dismantled after a failed attempt.
EnhanceSuccess=UIEnchantingItemCreate
EnhanceDismantle=UILockpickingPickBreak
; Equipment recycling (dismantle into materials) and magic arrow crafting.
Salvage=UIEnchantingItemCreate
ArrowCraft=UIEnchantingItemCreate
