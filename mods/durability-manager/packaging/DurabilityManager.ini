; Skyrim Durability Manager configuration.
; Changes made in the panel apply immediately.

[Hotkey]
; A-Z, F1-F12, Esc, Tab, Enter, Space, or a DirectInput scan code.
Key=F
Shift=true
Ctrl=false
Alt=false

[Display]
; A value of 30 means a warning below 30% durability.
LowDurabilityThreshold=30
WeaponDisplaySeconds=3.0
EnableLowDurabilityWarning=true

[Breakage]
; When false, enchanted equipment becomes broken instead of being destroyed.
; Unique equipment is always preserved as broken and repairable.
AllowEnchantedItemsToBreak=true

[Wear]
; A successful arrow shot reduces bow durability by this base amount.
BowShotWear=1.0
; A successful bolt shot reduces crossbow durability by this base amount.
CrossbowShotWear=2.0
; All wear-reduction cards combined cannot reduce shot wear beyond this value.
MaxWearReduction=0.70
