; Initial binding: Shift + DirectInput scan code 0x32 (M).
; Change the shortcut in the configuration panel; MusicManager.hotkey.json
; takes precedence over this legacy default when present.
[Hotkey]
ScanCode=0x32

[Library]
; Empty: Data/Music/MusicManager. The local MO2 installer sets the physical path
; so Open Folder works in Windows Explorer outside MO2's virtual filesystem.
Path=
